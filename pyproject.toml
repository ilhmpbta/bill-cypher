[project]
name = "bill-cypher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ilhmpbta", email = "178406185+ilhmpbta@users.noreply.github.com" },
    { name = "NewGenome", email = "crisisgear0@gmail.com" },
    { name = "Haaqil", email = "hanifaqil360@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-wtf>=1.3.0",
    "pycryptodome>=4.0.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
typeCheckingMode = "standard"
