<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bill-Cypher</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; background: #f9f9f9; color: #333; }
        nav { margin-bottom: 1.5rem; }
        nav a { margin-right: 1rem; text-decoration: none; color: #0066cc; }
        .flashes { list-style: none; padding: 0; }
        .flashes li { padding: 0.5rem; margin-bottom: 0.5rem; border-radius: 4px; }
        .flashes li.success { background: #d4edda; color: #155724; }
        .flashes li.danger { background: #f8d7da; color: #721c24; }
        .flashes li.info { background: #d1ecf1; color: #0c5460; }
        form { background: #fff; padding: 1.5rem; border: 1px solid #ddd; border-radius: 4px; max-width: 400px; }
        div.form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.3rem; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0.5rem; box-sizing: border-box; }
        input[type="submit"] { background: #0066cc; color: #fff; border: none; padding: 0.5rem 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('auth.login') }}">Login</a>
        <a href="{{ url_for('auth.register') }}">Register</a>
        {% if current_user.is_authenticated %}
        <form action="{{ url_for('auth.logout') }}" method="post" style="display:inline; padding:0; border:none; background:none;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <button type="submit" style="background:none; border:none; color:#0066cc; cursor:pointer; padding:0; font:inherit;">Logout</button>
        </form>
        {% endif %}
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flashes">
        {% for category, message in messages %}
          <li class="{{ category }}">{{ message }}</li>
        {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
